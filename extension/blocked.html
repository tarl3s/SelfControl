<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>SelfControl</title>
<style>
body{background:#000;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
h1{font-weight:500}ul{text-align:left}

<div id="warn"><h1>Termine suas tarefas antes de abrir <span id="site"></span></h1>

<div><select id="min"></select><button id="go">Breaktime</button></div></div>
<div id="exp" hidden><h1>Breaktime acabou, volte às tarefas</h1><button id="close">Fechar</button></div>
